<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор сетки MEXC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
  <aside class="card pairs">
    <input id="search" class="search" type="search" placeholder="Найти пару" autocomplete="off">
    <div class="status" id="status"><i></i><span>Подключение к MEXC…</span></div>
    <table class="pair-table">
      <thead><tr><th>Пара / объём</th><th class="right">Цена</th></tr></thead>
      <tbody id="pair-rows"><tr><td colspan="2" class="muted">Загружаю пары…</td></tr></tbody>
    </table>
  </aside>
  <main class="card calc">
    <div id="empty" class="empty">Загружаю текущую цену MEXC…</div>
    <div id="panel" hidden>
      <h1 id="title">Пара</h1>
      <form id="form" autocomplete="off">
        <label class="field"><span class="field-head">Цена первого входа
          <button type="button" id="live" class="live is-on">● fair price MEXC</button></span>
          <input id="p1" inputmode="decimal" placeholder="Текущая fair price MEXC"></label>
        <div class="tabs">
          <button type="button" class="tab" data-mode="target">Задать цель ликвидации</button>
          <button type="button" class="tab is-on" data-mode="leverage">Задать плечо</button>
        </div>
        <label class="field" id="box-target" hidden><span>Целевая ликвидация после шага 4</span>
          <input id="target" inputmode="decimal" placeholder="Например, 1.26"></label>
        <label class="field" id="box-leverage"><span>Плечо (по умолчанию из MEXC)</span>
          <input id="leverage" inputmode="numeric" placeholder="Загружается из аккаунта"></label>
        <label class="field"><span>Срок до шага 4, часов</span>
          <input id="hours" inputmode="decimal" type="number" min="0" max="720" step="1" value="24"></label>
        <button class="go" type="submit">Рассчитать сетку</button>
      </form>
      <div id="exchange-info" class="status bad">Нужен API-ключ MEXC только для чтения.</div>
      <p id="error" class="oops" hidden></p>
      <div id="result" hidden>
        <div class="head"><span class="lev">Плечо <b id="lev">—</b></span><span class="mmr" id="mmr-label">—</span></div>
        <div class="table-wrap"><table class="steps">
          <thead><tr><th>Шаг</th><th class="right">Вход fair price</th><th class="right">Маржа USDT</th><th class="right">Контракты</th><th class="right">Номинал USDT</th><th class="right">Ликвидация</th><th class="right">MMR</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <p class="muted" id="estimate-note">Оценка по текущим параметрам MEXC; реальные условия могут измениться.</p>
      </div>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
