<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор сетки MEXC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
  <aside class="card pairs">
    <input id="search" class="search" type="search" placeholder="Найти пару" autocomplete="off">
    <div class="status" id="status"><i></i><span>Подключение к MEXC…</span></div>
    <table class="pair-table">
      <thead><tr><th>Пара / объём</th><th class="right">Цена</th></tr></thead>
      <tbody id="pair-rows"><tr><td colspan="2" class="muted">Загружаю пары…</td></tr></tbody>
    </table>
  </aside>
  <main class="card calc">
    <div id="empty" class="empty">Загружаю текущую цену MEXC…</div>
    <div id="panel" hidden>
      <h1 id="title">Пара</h1>
      <form id="form" autocomplete="off">
        <label class="field"><span class="field-head">Цена первого входа
          <button type="button" id="live" class="live is-on">● по рынку</button></span>
          <input id="p1" inputmode="decimal" placeholder="Текущая цена MEXC"></label>
        <div class="tabs">
          <button type="button" class="tab" data-mode="target">Задать цель ликвидации</button>
          <button type="button" class="tab is-on" data-mode="leverage">Задать плечо</button>
        </div>
        <label class="field" id="box-target" hidden><span>Целевая ликвидация после шага 4</span>
          <input id="target" inputmode="decimal" placeholder="Например, 1.26"></label>
        <label class="field" id="box-leverage"><span>Плечо, целое число</span>
          <input id="leverage" inputmode="numeric" value="10" placeholder="Например, 20"></label>
        <details class="advanced"><summary>Дополнительные параметры</summary>
          <div class="advanced-grid">
            <label class="field"><span>MMR, % (пусто = 0%)</span><input id="mmr" inputmode="decimal" placeholder="MMR"></label>
            <label class="field"><span>Ликвидация шага 1 для калибровки</span><input id="liq1" inputmode="decimal" placeholder="Ликв. 1"></label>
            <label class="field"><span>Фандинг, % за списание</span><input id="funding" inputmode="decimal" value="0"></label>
            <label class="field"><span>Число списаний фандинга</span><input id="funding-count" inputmode="numeric" value="0"></label>
          </div>
        </details>
        <button class="go" type="submit">Рассчитать сетку</button>
      </form>
      <p id="error" class="oops" hidden></p>
      <div id="result" hidden>
        <div class="head"><span class="lev">Плечо <b id="lev">—</b></span><span class="mmr" id="mmr-label">—</span></div>
        <div class="table-wrap"><table class="steps">
          <thead><tr><th>Шаг</th><th class="right">Цена входа</th><th class="right">Маржа USDT</th><th class="right">Плечо</th><th class="right">Ликвидация</th><th class="right">% пути</th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </div>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
