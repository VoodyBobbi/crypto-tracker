{% extends "base.html" %}
{% block title %}Sign up — Crypto Tracker{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="auth-sub">It's free — start tracking the market in seconds.</p>
    <form method="post" class="auth-form" novalidate>
      <label>
        Username
        <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="new-password" required />
      </label>
      <label>
        Confirm password
        <input type="password" name="confirm" autocomplete="new-password" required />
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>
    <p class="auth-alt">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
